# The agent service, public for the web app hosted on the HackOnVibe team domain.
# Every route but /health, /login, /signup and /public/* needs a signed session token.
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, then
#   sudo certbot --nginx -d api.learis.lumbungstack.dev
limit_req_zone $binary_remote_addr zone=learis_auth:10m rate=10r/m;

server {
    server_name api.learis.lumbungstack.dev;
    listen 80;

    client_max_body_size 10m;

    # sign-in and sign-up: slow down password guessing
    location ~ ^/(login|signup)$ {
        limit_req zone=learis_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # agent runs can take minutes
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}

# LEARIS on one server: the agent service (Python, SQLite in a volume) and the web app (Next.js).
# Deployed by ops/deploy-docker-ssh.sh into /opt/learis; `name` fixes the volume names (learis_*).
name: learis

services:
  # Agent service (Python standard library, SQLite)
  agents:
    image: ${IMAGE_AGENTS:-learis-agents:local}
    build:
      context: ./learis/agent
      dockerfile: Dockerfile
    container_name: learis-agents
    restart: always
    environment:
      - LEARIS_HOST=0.0.0.0
      - PORT=8787
      - LEARIS_ENV=${LEARIS_ENV:-production}
      - LEARIS_DB=/app/data/learis.db
    env_file:
      - ./learis/agent/.env
    # Public through nginx as api-learis.utdi.me, for the web app hosted on HackOnVibe.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - agent_data:/app/data
    networks:
      - learis_network

  # Web app (Next.js standalone), reached through the server's reverse proxy on 127.0.0.1:3000
  learis:
    image: ${IMAGE_WEB:-learis-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learis-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LEARIS_API=http://agents:8787
    networks:
      - learis_network
    depends_on:
      - agents

volumes:
  agent_data:
    driver: local

networks:
  learis_network:
    driver: bridge
